    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RS Bazar</title>
    <style>
    :root {
      --bg: #120e0c;
      --bg-elevate: #1c1512;
      --card: #221a16;
      --border: #382a20;
      --text: #f5ede4;
      --text-muted: #a8988c;
      --accent: #ff3b2e;
      --accent-dim: #b32b21;
      --accent-2: #ffb020;
      --success: #33c17a;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,59,46,.14), transparent 60%),
        radial-gradient(ellipse 700px 400px at 100% 10%, rgba(255,176,32,.08), transparent 55%),
        var(--bg);
      color: var(--text);
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #1d1511, #17110e);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
      padding: 36px 28px;
    }
    .login-header { text-align: center; margin-bottom: 28px; }
    .login-logo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 38px;
      box-shadow: 0 8px 24px rgba(255,59,46,.35);
    }
    .login-header h1 {
      font-size: 30px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .login-header p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
    .auth-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      color: var(--text-muted);
    }
    .tab-btn.active {
      background: linear-gradient(90deg, var(--accent), var(--accent-dim));
      color: #fff;
      border-color: transparent;
    }
    .google-auth-wrap {
      margin: 16px 0 22px;
      text-align: center;
    }
    .google-btn-shell {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .google-status {
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 16px;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      height: 1px;
      background: var(--border);
      flex: 1;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: #0f0b08;
      color: var(--text);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(255,176,32,.15);
    }
    .login-btn {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: transform .15s ease, filter .15s ease;
    }
    .login-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .error-msg {
      background: rgba(255,59,46,.12);
      color: #ffb2aa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      border: 1px solid rgba(255,59,46,.35);
    }
    .error-msg.show { display: block; }
    .success-msg {
      background: rgba(51,193,122,.12);
      color: #9af0bf;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      border: 1px solid rgba(51,193,122,.35);
    }
    .success-msg.show { display: block; }
    .back-link { text-align: center; margin-top: 22px; }
    .back-link a {
      color: var(--accent-2);
      text-decoration: none;
      font-weight: 700;
    }
    .back-link a:hover { color: #ffd376; }
    </style>
    </head>
    <body>

    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">🔐</div>
            <h1>RS Bazar</h1>
            <p>Login or Create Account</p>
        </div>
        
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <div class="auth-tabs">
            <button class="tab-btn active" onclick="showTab('login')">Login</button>
            <button class="tab-btn" onclick="showTab('signup')">Sign Up</button>
        </div>

        <div class="google-auth-wrap">
            <div class="google-btn-shell" id="googleLoginBtn"></div>
            <div class="google-status" id="googleStatus">Google sign-in is available after a real Google OAuth client ID is configured.</div>
        </div>

        <div class="auth-divider">Or use your account</div>

        <!-- LOGIN TAB -->
        <div class="tab-content active" id="loginTab">
            <form id="loginForm">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" id="loginUsername" placeholder="Enter username or email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>

        <!-- SIGNUP TAB -->
        <div class="tab-content" id="signupTab">
            <form id="signupForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signupUsername" placeholder="Choose username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Choose password (min 6 chars)" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signupConfirm" placeholder="Repeat password" required>
                </div>
                <button type="submit" class="login-btn">Create Account</button>
            </form>
        </div>

        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer onload="window.googleGsiLoaded = true;" onerror="window.googleGsiLoadFailed = true;"></script>
    <script>
    var DEFAULT_USERS = [
        { username: 'roshanshah', email: 'roshan@example.com', password: 'killer3051Q', isAdmin: true },
        { username: 'testuser', email: 'test@example.com', password: 'test123', isAdmin: false },
        { username: 'demo', email: 'demo@example.com', password: 'demo123', isAdmin: false }
    ];

    // Get stored users from localStorage
    function getStoredUsers() {
        try {
            return JSON.parse(localStorage.getItem('siteUsers')) || [];
        } catch(e) {
            return [];
        }
    }

    // Get all users (default + stored)
    function getAllUsers() {
        var users = DEFAULT_USERS.slice();
        var stored = getStoredUsers();
        for (var i = 0; i < stored.length; i++) {
            var exists = false;
            for (var j = 0; j < users.length; j++) {
                if (users[j].username.toLowerCase() === stored[i].username.toLowerCase()) {
                    exists = true;
                    break;
                }
            }
            if (!exists) users.push(stored[i]);
        }
        return users;
    }

    // Find user by username or email
    function findUser(identifier) {
        var id = identifier.toLowerCase().trim();
        var users = getAllUsers();
        for (var i = 0; i < users.length; i++) {
            if (users[i].username.toLowerCase() === id || 
                (users[i].email && users[i].email.toLowerCase() === id)) {
                return users[i];
            }
        }
        return null;
    }

    async function apiCall(endpoint, options = {}) {
        const baseURL = 'http://localhost:5000';
        const url = `${baseURL}${endpoint}`;

        const defaultOptions = {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
            },
            ...options
        };

        const token = localStorage.getItem('token');
        if (token) {
            defaultOptions.headers['Authorization'] = `Bearer ${token}`;
        }

        try {
            const response = await fetch(url, defaultOptions);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || data.error || `HTTP error! status: ${response.status}`);
            }

            return data;
        } catch (error) {
            console.error('API call failed:', error);
            throw error;
        }
    }

    async function initGoogleAuth() {
        if (window.googleGsiLoadFailed) {
            document.getElementById('googleStatus').textContent = 'Google OAuth could not be loaded from the browser. Check your internet connection or configure Google OAuth properly.';
            return;
        }

        if (!window.google || !window.google.accounts || !window.google.accounts.id) {
            document.getElementById('googleStatus').textContent = 'Google OAuth is not ready yet. Please refresh the page after the Google script loads.';
            return;
        }

        try {
            const config = await apiCall('/api/google-config');
            if (!config.clientId) {
                document.getElementById('googleStatus').textContent = 'Google OAuth client ID is not configured on the server yet. Add a real Google client ID to enable Google Sign-In.';
                return;
            }

            window.google.accounts.id.initialize({
                client_id: config.clientId,
                callback: async function(response) {
                    try {
                        const data = await apiCall('/api/google-login', {
                            method: 'POST',
                            body: JSON.stringify({ id_token: response.credential })
                        });

                        localStorage.setItem('loggedInUser', data.user.username);
                        localStorage.setItem('userId', data.user.id);
                        if (data.user.is_admin) {
                            localStorage.setItem('isAdmin', '1');
                        } else {
                            localStorage.removeItem('isAdmin');
                        }

                        document.getElementById('successMsg').textContent = 'Google login successful! Redirecting...';
                        document.getElementById('successMsg').classList.add('show');

                        setTimeout(function() {
                            if (data.user.is_admin) {
                                window.location.href = 'admin.html';
                            } else {
                                window.location.href = 'index.html';
                            }
                        }, 800);
                    } catch (error) {
                        document.getElementById('errorMsg').textContent = error.message;
                        document.getElementById('errorMsg').classList.add('show');
                    }
                }
            });

            document.getElementById('googleStatus').textContent = 'Google sign-in is ready.';
            window.google.accounts.id.renderButton(document.getElementById('googleLoginBtn'), {
                theme: 'outline',
                size: 'large',
                width: '100%'
            });
        } catch (error) {
            document.getElementById('googleStatus').textContent = 'Google OAuth could not be initialized. Server configuration is missing or the API is unavailable.';
        }
    }

    function showTab(tab) {
        document.getElementById('loginTab').classList.remove('active');
        document.getElementById('signupTab').classList.remove('active');
        document.querySelectorAll('.tab-btn').forEach(function(btn) { btn.classList.remove('active'); });

        if (tab === 'login') {
            document.getElementById('loginTab').classList.add('active');
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
        } else {
            document.getElementById('signupTab').classList.add('active');
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
        }

        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    document.addEventListener('DOMContentLoaded', function() {
        initGoogleAuth();
    });

    // LOGIN FORM
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        var username = document.getElementById('loginUsername').value.trim();
        var password = document.getElementById('loginPassword').value;
        var errorMsg = document.getElementById('errorMsg');
        var successMsg = document.getElementById('successMsg');

        errorMsg.classList.remove('show');
        successMsg.classList.remove('show');

        if (!username || !password) {
            errorMsg.textContent = 'Please enter username and password';
            errorMsg.classList.add('show');
            return;
        }

        try {
            const data = await apiCall('/api/login', {
                method: 'POST',
                body: JSON.stringify({ identifier: username, password: password })
            });

            // Login successful
            localStorage.setItem('loggedInUser', data.user.username);
            localStorage.setItem('userId', data.user.id);
            if (data.user.is_admin) {
                localStorage.setItem('isAdmin', '1');
            } else {
                localStorage.removeItem('isAdmin');
            }

            successMsg.textContent = 'Login successful! Redirecting...';
            successMsg.classList.add('show');

            setTimeout(function() {
                if (data.user.is_admin) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'hlo.html';
                }
            }, 1000);
        } catch (error) {
            errorMsg.textContent = error.message;
            errorMsg.classList.add('show');
        }
    });

    // SIGNUP FORM
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        var username = document.getElementById('signupUsername').value.trim();
        var email = document.getElementById('signupEmail').value.trim().toLowerCase();
        var password = document.getElementById('signupPassword').value;
        var confirm = document.getElementById('signupConfirm').value;
        var errorMsg = document.getElementById('errorMsg');
        var successMsg = document.getElementById('successMsg');

        errorMsg.classList.remove('show');
        successMsg.classList.remove('show');

        if (!username || !email || !password) {
            errorMsg.textContent = 'All fields are required';
            errorMsg.classList.add('show');
            return;
        }

        if (password.length < 6) {
            errorMsg.textContent = 'Password must be at least 6 characters';
            errorMsg.classList.add('show');
            return;
        }

        if (password !== confirm) {
            errorMsg.textContent = 'Passwords do not match';
            errorMsg.classList.add('show');
            return;
        }

        try {
            await apiCall('/api/register', {
                method: 'POST',
                body: JSON.stringify({ username: username, email: email, password: password })
            });

            successMsg.textContent = 'Account created! You can now login.';
            successMsg.classList.add('show');

            // Clear form and switch to login
            this.reset();
            setTimeout(function() { showTab('login'); }, 1500);
        } catch (error) {
            errorMsg.textContent = error.message;
            errorMsg.classList.add('show');
        }
    });
    </script>

    </body>
    </html>
