<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS Bazar — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2140;
    --ink-2:#12162c;
    --ink-3:#252c52;
    --paper:#efe6d3;
    --paper-dim:#c9beA6;
    --brass:#c8992c;
    --brass-bright:#e7b544;
    --vermil:#c1502e;
    --ok:#4f9e6e;
    --line: rgba(239,230,211,0.14);
    --radius: 18px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
    font-family:'Work Sans', sans-serif;
    color:var(--paper);
    background:
      radial-gradient(700px 420px at 12% 0%, rgba(200,153,44,.16), transparent 60%),
      radial-gradient(600px 500px at 100% 100%, rgba(193,80,46,.12), transparent 55%),
      linear-gradient(180deg, var(--ink-2), var(--ink) 55%, var(--ink-2));
    background-attachment: fixed;
  }

  /* ambient market-lantern glow, purely decorative */
  .glow{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(231,181,68,.55), transparent 60%),
      radial-gradient(2px 2px at 82% 22%, rgba(231,181,68,.4), transparent 60%),
      radial-gradient(1.5px 1.5px at 65% 75%, rgba(231,181,68,.35), transparent 60%),
      radial-gradient(1.5px 1.5px at 35% 85%, rgba(231,181,68,.3), transparent 60%);
  }

  .wrap{ position:relative; z-index:1; width:100%; max-width:430px; }

  /* ---- Ticket / token card, the signature element ---- */
  .ticket{
    position:relative;
    background: linear-gradient(180deg, #232a52, #1a2043);
    border:1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 30px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);
    padding: 38px 32px 30px;
    overflow: visible;
  }
  /* perforation notches left & right, like a torn market token */
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:26px; height:26px;
    background: var(--ink-2);
    border-radius:50%;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .ticket::before{ left:-13px; }
  .ticket::after{ right:-13px; }
  .perf{
    position:absolute; left:26px; right:26px; top:128px;
    border-top: 2px dashed rgba(239,230,211,.18);
  }

  .stamp{
    width:64px; height:64px; margin:0 auto 14px;
    border-radius:50%;
    background: conic-gradient(from 220deg, var(--brass-bright), var(--brass) 40%, #a97b1f 60%, var(--brass-bright));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 22px rgba(200,153,44,.35), inset 0 0 0 3px rgba(18,22,44,.55);
    font-family:'Fraunces', serif;
    font-weight:700; font-size:22px; color:var(--ink-2);
  }

  .brand{ text-align:center; margin-bottom:26px; }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    letter-spacing: .01em;
    color: var(--paper);
  }
  .brand .eyebrow{
    display:block;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color: var(--brass-bright);
    margin-bottom:8px;
    font-weight:600;
  }
  .brand p{
    color: var(--paper-dim);
    font-size:13.5px;
    margin-top:6px;
  }

  .tabs{
    display:flex;
    background: rgba(0,0,0,.22);
    border:1px solid var(--line);
    border-radius: 999px;
    padding:4px;
    margin: 22px 0 22px;
  }
  .tab-btn{
    flex:1;
    padding:10px 0;
    border:none;
    background:transparent;
    color: var(--paper-dim);
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:.02em;
    border-radius:999px;
    cursor:pointer;
    transition: color .2s ease;
  }
  .tab-btn.active{
    background: linear-gradient(135deg, var(--brass-bright), var(--brass));
    color: var(--ink-2);
  }

  .panel{ display:none; }
  .panel.active{ display:block; animation: rise .28s ease; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    color: var(--paper-dim);
    margin-bottom:7px;
  }
  .field-input{ position:relative; }
  .field input{
    width:100%;
    padding:13px 14px;
    background: rgba(0,0,0,.24);
    border:1px solid var(--line);
    border-radius:10px;
    color: var(--paper);
    font-size:14.5px;
    font-family:'Work Sans', sans-serif;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder{ color: rgba(239,230,211,.32); }
  .field input:focus{
    outline:none;
    border-color: var(--brass-bright);
    box-shadow: 0 0 0 3px rgba(231,181,68,.15);
  }
  .field input.invalid{ border-color: var(--vermil); }
  .field .hint{
    font-size:11.5px;
    color: var(--paper-dim);
    margin-top:6px;
  }
  .field .hint.err{ color:#f0a08a; }
  .toggle-eye{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer;
    color: var(--paper-dim); font-size:12px; font-weight:600;
    letter-spacing:.02em;
  }
  .toggle-eye:hover{ color: var(--brass-bright); }

  .meter{ height:4px; border-radius:4px; background: rgba(255,255,255,.08); margin-top:8px; overflow:hidden; }
  .meter-fill{ height:100%; width:0%; border-radius:4px; transition: width .2s ease, background .2s ease; }

  .submit-btn{
    width:100%;
    padding:14px 0;
    margin-top:6px;
    border:none;
    border-radius:999px;
    background: linear-gradient(135deg, var(--vermil), #96391f);
    color: var(--paper);
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:.02em;
    cursor:pointer;
    transition: transform .15s ease, filter .15s ease, opacity .15s ease;
    box-shadow: 0 12px 26px rgba(193,80,46,.32);
  }
  .submit-btn:hover:not(:disabled){ transform: translateY(-2px); filter: brightness(1.07); }
  .submit-btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
  .submit-btn .spinner{
    display:inline-block; width:14px; height:14px;
    border:2px solid rgba(239,230,211,.4); border-top-color: var(--paper);
    border-radius:50%; vertical-align:-2px; margin-right:8px;
    animation: spin .7s linear infinite; display:none;
  }
  .submit-btn.loading .spinner{ display:inline-block; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .banner{
    display:none;
    align-items:flex-start; gap:10px;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:16px;
    line-height:1.4;
  }
  .banner.show{ display:flex; animation: rise .2s ease; }
  .banner.error{ background: rgba(193,80,46,.14); border:1px solid rgba(193,80,46,.4); color:#f3b7a2; }
  .banner.success{ background: rgba(79,158,110,.14); border:1px solid rgba(79,158,110,.4); color:#a9e0bd; }

  .divider{
    display:flex; align-items:center; gap:10px;
    margin: 20px 0 4px;
    color: var(--paper-dim);
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  }
  .divider::before, .divider::after{ content:""; height:1px; flex:1; background: var(--line); }

  .demo-note{
    margin-top:16px;
    padding:12px 14px;
    background: rgba(0,0,0,.2);
    border:1px dashed var(--line);
    border-radius:10px;
    font-size:12px;
    color: var(--paper-dim);
    line-height:1.55;
  }
  .demo-note b{ color: var(--brass-bright); font-weight:600; }

  .stub{
    text-align:center;
    margin-top:18px;
    font-size:12.5px;
    color: var(--paper-dim);
  }
  .stub a{ color: var(--brass-bright); text-decoration:none; font-weight:600; }
  .stub a:hover{ color: #ffd57a; }

  @media (max-width: 480px){
    .ticket{ padding:30px 22px 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="glow"></div>

<div class="wrap">
  <div class="ticket">
    <div class="perf"></div>

    <div class="stamp">RS</div>
    <div class="brand">
      <span class="eyebrow">Member Entry Token</span>
      <h1>RS Bazar</h1>
      <p>Sign in, or start a new account</p>
    </div>

    <div class="banner error" id="errorMsg"></div>
    <div class="banner success" id="successMsg"></div>

    <div class="tabs">
      <button class="tab-btn active" id="loginTabBtn" type="button">Login</button>
      <button class="tab-btn" id="signupTabBtn" type="button">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <div class="panel active" id="loginPanel">
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginUsername">Username or email</label>
          <div class="field-input">
            <input type="text" id="loginUsername" placeholder="roshanshah or you@example.com" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="field-input">
            <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password">
            <button type="button" class="toggle-eye" data-target="loginPassword">SHOW</button>
          </div>
        </div>
        <button type="submit" class="submit-btn" id="loginSubmit">
          <span class="spinner"></span><span class="btn-label">Log in</span>
        </button>
      </form>
      <div class="demo-note">
        Try it now — <b>demo</b> / <b>demo123</b>, or <b>roshanshah</b> / <b>killer3051Q</b> (admin).
      </div>
    </div>

    <!-- SIGNUP -->
    <div class="panel" id="signupPanel">
      <form id="signupForm" novalidate>
        <div class="field">
          <label for="signupUsername">Username</label>
          <div class="field-input">
            <input type="text" id="signupUsername" placeholder="Choose a username" autocomplete="username">
          </div>
          <div class="hint" id="usernameHint"></div>
        </div>
        <div class="field">
          <label for="signupEmail">Email</label>
          <div class="field-input">
            <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="hint" id="emailHint"></div>
        </div>
        <div class="field">
          <label for="signupPassword">Password</label>
          <div class="field-input">
            <input type="password" id="signupPassword" placeholder="At least 6 characters" autocomplete="new-password">
            <button type="button" class="toggle-eye" data-target="signupPassword">SHOW</button>
          </div>
          <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
          <div class="hint" id="passwordHint">Use 6+ characters. Mix in a number for a stronger token.</div>
        </div>
        <div class="field">
          <label for="signupConfirm">Confirm password</label>
          <div class="field-input">
            <input type="password" id="signupConfirm" placeholder="Repeat password" autocomplete="new-password">
            <button type="button" class="toggle-eye" data-target="signupConfirm">SHOW</button>
          </div>
          <div class="hint" id="confirmHint"></div>
        </div>
        <button type="submit" class="submit-btn" id="signupSubmit">
          <span class="spinner"></span><span class="btn-label">Create account</span>
        </button>
      </form>
    </div>

    <div class="stub">
      <a href="index.html">← Back to home</a>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   RS Bazar auth — fully working in the browser, no backend required.
   Uses the SAME localStorage keys as admin.html so the two pages share one
   "database": accounts live under "users" (admin.html's Users tab reads
   and edits this exact array), and a successful login sets "loggedInUser"
   / "isAdmin" — which is exactly what admin.html checks on load to decide
   whether to let someone in or bounce them back here.
   If you later add a real backend, replace loadUsers()/saveNewUser() with
   real fetch() calls — the rest of the UI (validation, banners, spinners)
   needs no changes.
   ========================================================================= */

const STORAGE_KEY = 'users'; // shared with admin.html's LS.users

const DEFAULT_USERS = [
  { username: 'roshanshah', email: 'roshan@example.com', password: 'killer3051Q', isAdmin: true },
  { username: 'testuser',   email: 'test@example.com',   password: 'test123',      isAdmin: false },
  { username: 'demo',       email: 'demo@example.com',   password: 'demo123',      isAdmin: false }
];

// Seed the shared "users" store once, so admin.html's Users tab has
// something to show even before anyone signs up.
(function ensureUsersSeeded(){
  if (localStorage.getItem(STORAGE_KEY) === null) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_USERS));
  }
})();

function loadUsers(){
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(stored) ? stored : DEFAULT_USERS.slice();
  } catch(e){ return DEFAULT_USERS.slice(); }
}

function saveNewUser(user){
  const stored = loadUsers();
  stored.push(user);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
}

function findUser(identifier){
  const id = identifier.trim().toLowerCase();
  return loadUsers().find(u =>
    u.username.toLowerCase() === id || (u.email && u.email.toLowerCase() === id)
  ) || null;
}

/* ---------- tab switching ---------- */
const loginTabBtn = document.getElementById('loginTabBtn');
const signupTabBtn = document.getElementById('signupTabBtn');
const loginPanel = document.getElementById('loginPanel');
const signupPanel = document.getElementById('signupPanel');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');

function showTab(tab){
  const isLogin = tab === 'login';
  loginTabBtn.classList.toggle('active', isLogin);
  signupTabBtn.classList.toggle('active', !isLogin);
  loginPanel.classList.toggle('active', isLogin);
  signupPanel.classList.toggle('active', !isLogin);
  clearBanners();
}
loginTabBtn.addEventListener('click', () => showTab('login'));
signupTabBtn.addEventListener('click', () => showTab('signup'));

function clearBanners(){
  errorMsg.classList.remove('show'); errorMsg.textContent = '';
  successMsg.classList.remove('show'); successMsg.textContent = '';
}
function showError(msg){
  clearBanners();
  errorMsg.textContent = msg;
  errorMsg.classList.add('show');
}
function showSuccess(msg){
  clearBanners();
  successMsg.textContent = msg;
  successMsg.classList.add('show');
}

/* ---------- show/hide password ---------- */
document.querySelectorAll('.toggle-eye').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const hidden = input.type === 'password';
    input.type = hidden ? 'text' : 'password';
    btn.textContent = hidden ? 'HIDE' : 'SHOW';
  });
});

/* ---------- live validation on signup ---------- */
const suUsername = document.getElementById('signupUsername');
const suEmail = document.getElementById('signupEmail');
const suPassword = document.getElementById('signupPassword');
const suConfirm = document.getElementById('signupConfirm');
const usernameHint = document.getElementById('usernameHint');
const emailHint = document.getElementById('emailHint');
const passwordHint = document.getElementById('passwordHint');
const confirmHint = document.getElementById('confirmHint');
const meterFill = document.getElementById('meterFill');

function setHint(el, input, msg, isErr){
  el.textContent = msg || '';
  el.classList.toggle('err', !!isErr);
  input.classList.toggle('invalid', !!isErr);
}

suUsername.addEventListener('input', () => {
  const v = suUsername.value.trim();
  if (!v){ setHint(usernameHint, suUsername, '', false); return; }
  if (v.length < 3){ setHint(usernameHint, suUsername, 'Username needs at least 3 characters.', true); return; }
  if (findUser(v)){ setHint(usernameHint, suUsername, 'That username is already taken.', true); return; }
  setHint(usernameHint, suUsername, 'Username is available.', false);
});

suEmail.addEventListener('input', () => {
  const v = suEmail.value.trim();
  if (!v){ setHint(emailHint, suEmail, '', false); return; }
  const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  if (!valid){ setHint(emailHint, suEmail, 'Enter a valid email address.', true); return; }
  if (findUser(v)){ setHint(emailHint, suEmail, 'An account already uses this email.', true); return; }
  setHint(emailHint, suEmail, '', false);
});

function passwordStrength(v){
  let score = 0;
  if (v.length >= 6) score++;
  if (v.length >= 10) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  return score; // 0-5
}
suPassword.addEventListener('input', () => {
  const v = suPassword.value;
  const score = passwordStrength(v);
  const pct = Math.min(100, (score / 5) * 100);
  meterFill.style.width = pct + '%';
  const colors = ['#c1502e', '#c1502e', '#e7b544', '#e7b544', '#4f9e6e', '#4f9e6e'];
  meterFill.style.background = colors[score];
  if (!v){ setHint(passwordHint, suPassword, 'Use 6+ characters. Mix in a number for a stronger token.', false); }
  else if (v.length < 6){ setHint(passwordHint, suPassword, 'At least 6 characters needed.', true); }
  else { setHint(passwordHint, suPassword, score >= 4 ? 'Strong password.' : 'Good — could be stronger with symbols.', false); }
  if (suConfirm.value) validateConfirm();
});

function validateConfirm(){
  if (!suConfirm.value){ setHint(confirmHint, suConfirm, '', false); return true; }
  if (suConfirm.value !== suPassword.value){ setHint(confirmHint, suConfirm, 'Passwords do not match.', true); return false; }
  setHint(confirmHint, suConfirm, 'Passwords match.', false);
  return true;
}
suConfirm.addEventListener('input', validateConfirm);

/* ---------- submit: login ---------- */
const loginForm = document.getElementById('loginForm');
const loginSubmit = document.getElementById('loginSubmit');

function setLoading(btn, isLoading){
  btn.disabled = isLoading;
  btn.classList.toggle('loading', isLoading);
}

loginForm.addEventListener('submit', function(e){
  e.preventDefault();
  clearBanners();

  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!username || !password){
    showError('Please enter both a username/email and password.');
    return;
  }

  setLoading(loginSubmit, true);
  setTimeout(() => { // tiny delay so the loading state is visible
    const user = findUser(username);
    if (!user || user.password !== password){
      setLoading(loginSubmit, false);
      showError('Incorrect username/email or password.');
      return;
    }

    localStorage.setItem('loggedInUser', user.username);
    if (user.isAdmin) {
      localStorage.setItem('isAdmin', '1');
    } else {
      localStorage.removeItem('isAdmin');
    }

    setLoading(loginSubmit, false);
    showSuccess('Login successful! Redirecting…');
    setTimeout(() => {
      window.location.href = user.isAdmin ? 'admin.html' : 'hlo.html';
    }, 900);
  }, 400);
});

/* ---------- submit: signup ---------- */
const signupForm = document.getElementById('signupForm');
const signupSubmit = document.getElementById('signupSubmit');

signupForm.addEventListener('submit', function(e){
  e.preventDefault();
  clearBanners();

  const username = suUsername.value.trim();
  const email = suEmail.value.trim().toLowerCase();
  const password = suPassword.value;
  const confirm = suConfirm.value;

  if (!username || !email || !password || !confirm){
    showError('All fields are required.');
    return;
  }
  if (username.length < 3){
    showError('Username needs at least 3 characters.');
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showError('Enter a valid email address.');
    return;
  }
  if (password.length < 6){
    showError('Password must be at least 6 characters.');
    return;
  }
  if (password !== confirm){
    showError('Passwords do not match.');
    return;
  }
  if (findUser(username)){
    showError('That username is already taken.');
    return;
  }
  if (findUser(email)){
    showError('An account already uses this email.');
    return;
  }

  setLoading(signupSubmit, true);
  setTimeout(() => {
    saveNewUser({ username, email, password, isAdmin: false });
    setLoading(signupSubmit, false);
    showSuccess('Account created! You can log in now.');
    signupForm.reset();
    meterFill.style.width = '0%';
    [usernameHint, emailHint, passwordHint, confirmHint].forEach(h => h.classList.remove('err'));
    passwordHint.textContent = 'Use 6+ characters. Mix in a number for a stronger token.';
    [suUsername, suEmail, suPassword, suConfirm].forEach(i => i.classList.remove('invalid'));
    setTimeout(() => showTab('login'), 1200);
  }, 500);
});
</script>
</body>
</html>
