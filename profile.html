<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Himalayan Digitals</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container{max-width:1000px;margin:40px auto;padding:20px}
        .profile-header{background:linear-gradient(135deg,#2b9be3,#1e7ab8);color:#fff;padding:30px;border-radius:10px;margin-bottom:30px}
        .profile-header h1{margin:0;font-size:28px}
        .orders-section{background:#fff;color:#333;padding:20px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
        .orders-section h2{color:#333;margin:0 0 15px;padding-bottom:15px;border-bottom:2px solid #f0f0f0}
        .order-card{background:#f9f9f9;border:1px solid #ddd;border-radius:8px;padding:15px;margin-bottom:15px}
        .order-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
        .order-game{font-weight:600;color:#333;font-size:16px}
        .order-status{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;background:#fff3cd;color:#856404}
        .order-status.completed{background:#d4edda;color:#155724}
        .order-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px;font-size:14px}
        .detail-item{background:#fff;padding:10px;border-radius:4px;border-left:3px solid #2b9be3;overflow-wrap:anywhere}
        .detail-label{color:#666;font-size:12px;text-transform:uppercase;margin-bottom:3px}
        .detail-value{color:#333;font-weight:600}
        .back-btn,.profile-action{display:inline-block;margin-bottom:20px;padding:10px 20px;background:#f0f0f0;color:#333;text-decoration:none;border:0;border-radius:5px;cursor:pointer}
        .profile-action{background:#1e7ab8;color:#fff;margin:12px 0 0}
        .empty-state{padding:20px;color:#666}
    </style>
</head>
<body>
    <main class="profile-container">
        <div>
            <a href="index.html" class="back-btn">← Back to Home</a>
            <button class="profile-action" id="logoutBtn" type="button">Sign out</button>
        </div>
        <header class="profile-header">
            <h1>My Profile</h1>
            <p>Welcome, <strong id="profileUsername">Customer</strong></p>
        </header>
        <section class="orders-section">
            <h2>My Orders</h2>
            <div id="ordersContainer" class="empty-state">Loading your orders…</div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="profile.js"></script>
</body>
</html>
